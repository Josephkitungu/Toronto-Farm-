<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Four Column Footer</title>

<style>

  * { box-sizing: border-box; }

  body {

    margin: 0;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

    background: #f7f7f8;

  }

  footer {

    background: #0ba14e;

    color: #cfcfd6;

    padding: 48px 24px 24px;

  }

  .footer-container {

    max-width: 1100px;

    margin: 0 auto;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 32px;

  }

  .footer-col h3 {

    color: #ffffff;

    font-size: 15px;

    font-weight: 600;

    margin: 0 0 16px;

    letter-spacing: 0.02em;

  }

  .footer-col ul {

    list-style: none;

    margin: 0;

    padding: 0;

  }

  .footer-col li {

    margin-bottom: 10px;

  }

  .footer-col a {

    color: #cfcfd6;

    text-decoration: none;

    font-size: 14px;

    transition: color 0.15s ease;

  }

  .footer-col a:hover,

  .footer-col a:focus-visible {

    color: #ffffff;

  }

  .footer-col p {

    font-size: 14px;

    line-height: 1.6;

    margin: 0 0 12px;

  }

  .footer-bottom {

    max-width: 1100px;

    margin: 40px auto 0;

    padding-top: 20px;

    border-top: 1px solid  rgba(15, 14, 14, 0.1);

    display: flex;

    justify-content: space-between;

    flex-wrap: wrap;

    gap: 12px;

    font-size: 13px;

    color: #1111bb;

  }

  .footer-bottom a {

    color: #222280;

    text-decoration: none;

    margin-left: 16px;

  }

  .footer-bottom a:hover {

    color: #ffffff;

  }

  @media (max-width: 768px) {

    .footer-container {

      grid-template-columns: repeat(2, 1fr);

      gap: 28px;

    }

  }

  @media (max-width: 480px) {

    .footer-container {

      grid-template-columns: 1fr;

    }

    .footer-bottom {

      flex-direction: column;

    }

    .footer-bottom a {

      margin-left: 0;

      margin-right: 16px;

    }

  }

</style>

</head>
